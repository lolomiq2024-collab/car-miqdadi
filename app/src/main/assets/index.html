<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفيق الطريق الإسلامي</title>
<style>
  :root {
    --g1: #0f172a; --g2: #1e293b; --g3: #020617;
    --accent: #facc15; --text: #f8fafc; --muted: #94a3b8;
    --card: rgba(30, 41, 59, 0.4); --radius: 12px;
    --fs: 1.65; --gap: .8em;
    --t-cap: .7em; --t-sm: .85em; --t-body: 1em; --t-title: 1.3em;
    --c-quran: #facc15; --c-lessons: #3b82f6; --c-youtube: #ef4444;
    --c-map: #10b981; --c-songs: #8b5cf6; --c-prayer: #facc15; --c-phone: #6366f1;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #000; color: var(--text); font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  .frame { width: min(100%, 1100px); container-type: inline-size; }
  .screen { width: 100%; aspect-ratio: 16/9; border-radius: 16px; border: 2px solid #334155; overflow: hidden; position: relative; background: linear-gradient(160deg, var(--g1) 0%, var(--g2) 48%, var(--g3) 100%); display: grid; grid-template-columns: 4.7em 1fr; font-size: calc(var(--fs) * 1cqw); }
  .rail { display: flex; flex-direction: column; align-items: center; gap: .7em; padding: .7em 0; overflow-y: auto; scrollbar-width: none; position: relative; z-index: 1; }
  .rail .ico { width: 2.9em; height: 2.9em; border-radius: 50%; display: grid; place-items: center; font-size: 1.35em; transition: transform .15s, box-shadow .15s; background: rgba(255,255,255,.05); }
  .rail button { display: flex; flex-direction: column; align-items: center; gap: .2em; color: var(--muted); font-size: var(--t-cap); }
  .rail button.on { color: var(--accent); }
  .rail button.on .ico, .rail button:hover .ico { transform: scale(1.1); box-shadow: 0 0 0 .12em var(--accent); background: rgba(250, 204, 21, 0.1); }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; z-index: 1; }
  .top { display: flex; align-items: center; gap: .65em; padding: .8em .9em .3em 1.1em; }
  .search { flex: 1; display: flex; align-items: center; gap: .55em; background: rgba(255,255,255,.08); border-radius: 999px; padding: 0 1em; height: 2.55em; }
  .search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); }
  .pill { background: rgba(255,255,255,.1); border-radius: 999px; padding: 0 1em; height: 2.55em; font-size: var(--t-body); color: var(--text); border: 1px solid rgba(255,255,255,.1); }
  .pill:hover { background: var(--accent); color: #000; }
  .panels { flex: 1; display: flex; gap: var(--gap); padding: .3em .9em .55em 1.1em; min-height: 0; }
  .panel { flex: 1; min-width: 0; container-type: inline-size; overflow-y: auto; overflow-x: hidden; border-radius: var(--radius); padding: .2em .3em; scrollbar-width: none; }
  .sec { color: var(--muted); font-size: var(--t-sm); margin: .5em .2em; }
  .card { flex: 0 0 auto; width: clamp(4.3em, calc(100cqw / 4.65), 10em); aspect-ratio: 16/10; border-radius: var(--radius); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: .55em .65em; text-align: center; transition: transform .15s, box-shadow .15s; background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
  .card b { font-size: clamp(.6em, 2.4cqw, .85em); line-height: 1.35; overflow-wrap: anywhere; color: #fff; }
  .card:hover { transform: scale(1.05); box-shadow: 0 0 0 .12em var(--accent); }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .65em; padding: .45em .2em .8em; }
  .grid4 .card { width: auto; }
  .reciter { display: flex; align-items: center; gap: .6em; width: 100%; height: 2.4em; padding: 0 1em; margin: .2em 0 .4em; background: rgba(255,255,255,.05); border-radius: 999px; font-size: var(--t-sm); border: 1px solid rgba(255,255,255,.05); }
  .reciter b { flex: 1; text-align: right; font-size: var(--t-body); color: var(--accent); }
  .bar { display: flex; align-items: center; gap: 10px; margin: 0 .9em .65em 1.1em; padding: .35em .9em .85em; background: rgba(15, 23, 42, .8); backdrop-filter: blur(10px); border-radius: 999px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.05); }
  .bar .title { flex: 1; font-size: var(--t-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl { width: 2.55em; height: 2.55em; border-radius: 50%; background: rgba(255,255,255,.1); font-size: var(--t-body); }
  .ctl.big { background: var(--accent); color: #000; width: 2.9em; height: 2.9em; font-weight: bold; }
  .progress { position: absolute; bottom: 0; right: 0; left: 0; height: .55em; background: rgba(255,255,255,.1); cursor: pointer; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); }

  /* تصميم الصلاة */
  .pr-container { display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .pr-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(15, 23, 42, 0.4); border-radius: 12px; border: 1px solid rgba(250, 204, 21, 0.1); }
  .pr-top-bar h2 { font-size: 1.2rem; color: var(--accent); margin: 0; }
  .pr-screens { display: flex; gap: 15px; flex: 1; min-height: 0; }
  @media (max-width: 760px) { .pr-screens { flex-direction: column; } }
  .pr-glass-card { flex: 1; background: rgba(10, 15, 30, 0.2); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); padding: 15px; display: flex; flex-direction: column; }
  .pr-countdown { text-align: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
  .pr-countdown small { color: var(--muted); font-size: 0.9rem; display: block; margin-bottom: 5px; }
  .pr-countdown b { font-size: 2.2rem; color: var(--accent); font-weight: 700; direction: ltr; font-family: monospace; }
  .pr-list { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }
  .pr-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-radius: 8px; background: rgba(255, 255, 255, 0.03); border-left: 4px solid transparent; }
  .pr-item span { color: #cbd5e1; font-size: 1rem; }
  .pr-item strong { color: #f1f5f9; font-size: 1.1rem; direction: ltr; }
  .pr-item.next { background: rgba(250, 204, 21, 0.1); border-left-color: var(--accent); border-radius: 8px 20px 20px 8px; }
  .pr-item.next span, .pr-item.next strong { color: var(--accent); font-weight: bold; }
  .pr-qibla-card { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .pr-qibla-header { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; color: var(--accent); font-weight: bold; }
  .compass-container { width: 200px; height: 200px; position: relative; margin-top: 30px; }
  .compass-circle { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--accent); position: relative; background: radial-gradient(circle, rgba(15,23,42,0.8) 0%, rgba(0,0,0,0) 70%); }
  .compass-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; background: var(--accent); border-radius: 50%; }
  .dir { position: absolute; color: var(--muted); font-weight: bold; }
  .dir-n { top: 10px; left: 50%; transform: translateX(-50%); color: var(--accent); }
  .dir-s { bottom: 10px; left: 50%; transform: translateX(-50%); }
  .dir-e { right: 10px; top: 50%; transform: translateY(-50%); }
  .dir-w { left: 10px; top: 50%; transform: translateY(-50%); }
  .qibla-arrow { position: absolute; top: 50%; left: 50%; width: 2px; height: 90px; background: linear-gradient(to top, transparent, var(--accent)); transform-origin: bottom center; transform: translate(-50%, -100%); transition: transform 0.5s ease-out; }
  .qibla-arrow::before { content: ''; position: absolute; top: -10px; left: -5px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 12px solid var(--accent); }
  .compass-kaaba { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; }
</style>
</head>
<body>
<div class="frame"><div class="screen" id="screen">
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <div class="top">
      <div class="search"><input id="q" placeholder="ابحث عن سورة…"></div>
      <button class="pill" id="splitBtn">شاشة واحدة</button>
    </div>
    <div class="panels" id="panels"></div>
    <div class="bar">
      <span class="title" id="nowTitle">لا يوجد تشغيل</span>
      <button class="ctl" id="prev">⏮</button>
      <button class="ctl big" id="play">▶</button>
      <button class="ctl" id="next">⏭</button>
      <div class="progress"><i id="prog"></i></div>
    </div>
  </div>
</div>
</div>

<script>
// ====== المتغيرات الأساسية ======
const reciters = ["مشاري العفاسي", "عبد الباسط عبد الصمد", "المنشاوي", "عبد الرحمن السديس", "ماهر المعيقلي"];
const reciterBase = [
  "https://server8.mp3quran.net/afs/",
  "https://server7.mp3quran.net/basit/",
  "https://server10.mp3quran.net/minsh/",
  "https://server11.mp3quran.net/sds/",
  "https://server12.mp3quran.net/maher/"
];
const surahs = "الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(",");
const CITIES_JO = {"عمّان":[31.9539,35.9106],"إربد":[32.5556,35.8500],"الزرقاء":[32.0728,36.0876],"العقبة":[29.5321,35.0063],"السلط":[32.0392,35.7272],"المفرق":[32.3406,36.2080]};
const PRAYERS = [["fajr","Fajr (الفجر)"],["sunrise","الشروق"],["dhuhr","Dhuhr (الظهر)"],["asr","Asr (العصر)"],["maghrib","Maghrib (المغرب)"],["isha","Isha (العشاء)"]];
const PS_DEF = { city:"إربد", lat:32.5556, lng:35.8500, adj:{fajr:0,sunrise:0,dhuhr:0,asr:0,maghrib:0,isha:0}, asr:1 };

let _ps = null;
function PS() {
  if (_ps) return _ps;
  let s = {}; try { s = JSON.parse(localStorage.getItem("pray") || "{}"); } catch (e) {}
  _ps = Object.assign({}, PS_DEF, s, { adj: Object.assign({}, PS_DEF.adj, s.adj || {}) });
  return _ps;
}
function savePS() { try { localStorage.setItem("pray", JSON.stringify(_ps)); } catch (e) {} }

const $ = id => document.getElementById(id);
const mkEl = (tag, cls, html) => { const d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; };
const state = { split:true, panels:["quran","prayer"], active:0, reciter:0, q:"", openSinger:null, openSeries:null, reciterOpen:false };
window.audioPlayer = new Audio();

// ====== محرك أوقات الصلاة ======
const PT = (() => {
  const R = Math.PI / 180, sin = a => Math.sin(a * R), cos = a => Math.cos(a * R), tan = a => Math.tan(a * R);
  const asin = x => Math.asin(x) / R, acos = x => Math.acos(x) / R, atan2 = (y, x) => Math.atan2(y, x) / R, acot = x => Math.atan(1 / x) / R;
  const fixA = a => a - 360 * Math.floor(a / 360), fixH = h => h - 24 * Math.floor(h / 24);
  function julian(y, m, d) { if (m <= 2) { y -= 1; m += 12; } const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4); return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5; }
  function sunPos(jd) {
    const d = jd - 2451545.0, g = fixA(357.529 + 0.98560028 * d), q = fixA(280.459 + 0.98564736 * d);
    const L = fixA(q + 1.915 * sin(g) + 0.020 * sin(2 * g)), e = 23.439 - 0.00000036 * d;
    const RA = fixH(atan2(cos(e) * sin(L), cos(L)) / 15);
    return { decl: asin(sin(e) * sin(L)), eqt: q / 15 - RA };
  }
  function compute(date, lat, lng, tz, m, asrF) {
    const jd = julian(date.getFullYear(), date.getMonth() + 1, date.getDate()) - lng / 360;
    const mid = t => fixH(12 - sunPos(jd + t).eqt);
    const ang = (a, t, ccw) => { const dc = sunPos(jd + t).decl, x = (-sin(a) - sin(dc) * sin(lat)) / (cos(dc) * cos(lat)); if (Math.abs(x) > 1) return NaN; return mid(t) + (ccw ? -1 : 1) * acos(x) / 15; };
    const asr = t => { const dc = sunPos(jd + t).decl; return ang(-acot(asrF + tan(Math.abs(lat - dc))), t); };
    let raw = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, sunset: 18, maghrib: 18, isha: 18 };
    for (let k = 0; k < 2; k++) {
      const t = {}; for (const x in raw) t[x] = raw[x] / 24;
      raw = { fajr: ang(18, t.fajr, true), sunrise: ang(0.833, t.sunrise, true), dhuhr: mid(t.dhuhr), asr: asr(t.asr), sunset: ang(0.833, t.sunset), maghrib: ang(0.833, t.maghrib), isha: ang(17, t.isha) };
    }
    const out = {}; for (const x in raw) out[x] = raw[x] + tz - lng / 15;
    return out;
  }
  return { compute };
})();

function dayTimes(date) {
  const s = PS();
  const tz = -new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12).getTimezoneOffset() / 60;
  const h = PT.compute(date, s.lat, s.lng, tz, {f:18, i:17}, +s.asr);
  const base = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
  return PRAYERS.map(([k, n]) => ({ k, n, pray: k !== "sunrise", t: base + (h[k] - tz) * 3600000 + (s.adj[k] || 0) * 60000 }));
}
const fmtT = t => isFinite(t) ? new Date(t).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true }) : "—";
function nextPrayer() {
  const now = Date.now();
  for (let d = 0; d < 2; d++) { const day = new Date(); day.setDate(day.getDate() + d); for (const p of dayTimes(day)) if (p.pray && p.t > now) return p; }
  return null;
}
function countdown(ms) { const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000); return `${String(h).padStart(2,'0')}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; }

// ====== واجهة الصلاة ======
function prayerView() {
  const s = PS(), root = mkEl("div", "pr-container");
  let hijri = ""; try { hijri = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", { day: "numeric", month: "long", year: "numeric" }).format(new Date()); } catch (e) {}
  
  root.innerHTML = `
    <div class="pr-top-bar">
      <h2>🌙 المؤذن</h2>
      <div style="color:#94a3b8; font-size:0.85rem; text-align:left;">
        <div>${s.city} | ${hijri}</div>
      </div>
    </div>
    <div class="pr-screens">
      <div class="pr-glass-card">
        <div class="pr-countdown">
          <small>Next Prayer: ${nextPrayer() ? nextPrayer().n : "—"}</small>
          <b id="pcount">${nextPrayer() ? countdown(nextPrayer().t - Date.now()) : "00:00:00"}</b>
        </div>
        <div class="pr-list" id="prayerList">
          ${dayTimes(new Date()).map(p => `
            <div class="pr-item ${nextPrayer() && nextPrayer().k === p.k ? 'next' : ''}">
              <span>${p.n}</span>
              <strong>${fmtT(p.t)}</strong>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="pr-glass-card pr-qibla-card">
        <div class="pr-qibla-header"><div>قبلة <br><span id="qiblaDegree">0°</span></div><span>Makkah</span></div>
        <div class="compass-container">
          <div class="compass-circle">
            <div class="dir dir-n">N</div><div class="dir dir-s">S</div><div class="dir dir-e">E</div><div class="dir dir-w">W</div>
            <div class="compass-center"></div>
            <div class="qibla-arrow" id="qiblaArrow"><div class="compass-kaaba">🕋</div></div>
          </div>
        </div>
      </div>
    </div>
  `;

  setTimeout(() => {
    const arrow = document.getElementById('qiblaArrow');
    if (arrow) {
      const lat = s.lat, lng = s.lng, makkahLat = 21.4225, makkahLng = 39.8262;
      const phi1 = lat * Math.PI / 180, phi2 = makkahLat * Math.PI / 180, deltaLambda = (makkahLng - lng) * Math.PI / 180;
      const y = Math.sin(deltaLambda), x = Math.cos(phi1) * Math.tan(phi2) - Math.sin(phi1) * Math.cos(deltaLambda);
      const qiblaAngle = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
      arrow.style.transform = `translate(-50%, -100%) rotate(${qiblaAngle}deg)`;
      document.getElementById('qiblaDegree').textContent = Math.round(qiblaAngle) + '°';
    }
  }, 100);

  const int = setInterval(() => {
    const c = root.querySelector("#pcount");
    const p = nextPrayer();
    if (c && p) c.textContent = countdown(p.t - Date.now());
  }, 1000);
  
  const obs = new MutationObserver(() => { if (!document.body.contains(root)) { clearInterval(int); obs.disconnect(); } });
  obs.observe($("panels"), { childList: true });
  return root;
}

// ====== بناء الواجهة ======
const TYPES = {
  quran: {label:"القرآن", icon:"📖", color:"--c-quran"},
  lessons: {label:"الدروس", icon:"🎙️", color:"--c-lessons"},
  youtube: {label:"يوتيوب", icon:"▶", color:"--c-youtube"},
  songs: {label:"الأغاني", icon:"🎵", color:"--c-songs"},
  prayer: {label:"الصلاة", icon:"🕌", color:"--c-prayer"},
  phone: {label:"الهاتف", icon:"📞", color:"--c-phone"},
  map: {label:"الخريطة", icon:"🗺️", color:"--c-map"},
};

function renderRail() {
  const rail = $("rail"); rail.innerHTML = "";
  const cur = state.panels[state.active];
  for (const [k, t] of Object.entries(TYPES)) {
    const b = document.createElement("button");
    if (k === cur) b.className = "on";
    b.innerHTML = `<span class="ico" style="color:var(${t.color})">${t.icon}</span>${t.label}`;
    b.onclick = () => { state.panels[state.active] = k; render(); };
    rail.appendChild(b);
  }
}

function render() {
  const wrap = $("panels"); wrap.innerHTML = "";
  const n = state.split ? 2 : 1;
  if (state.active >= n) state.active = 0;
  for (let i = 0; i < n; i++) wrap.appendChild(panel(i));
  $("splitBtn").textContent = state.split ? "شاشة واحدة" : "تقسيم الشاشة";
  renderRail();
}

function sec(t) { const d = document.createElement("div"); d.className = "sec"; d.textContent = t; return d; }
function card(i, title, sub, fn, wide) {
  const b = document.createElement("button");
  b.className = "card" + (wide ? " wide" : "");
  b.innerHTML = `<b>${title}</b>${sub ? `<small>${sub}</small>` : ""}`;
  b.onclick = fn; return b;
}

// ====== دالة عرض المحتوى ======
function panel(i) {
  const type = state.panels[i];
  const el = document.createElement("div");
  el.className = "panel" + (i === state.active ? " active" : "");
  el.onclick = () => { if (state.active !== i) { state.active = i; render(); } };

  if (type === "quran") {
    const rb = document.createElement("button"); rb.className = "reciter";
    rb.innerHTML = `<span>🎙️ القارئ</span><b>${reciters[state.reciter]}</b><span>▾</span>`;
    rb.onclick = e => { e.stopPropagation(); state.reciterOpen = !state.reciterOpen; render(); };
    el.appendChild(rb);

    if (state.reciterOpen) {
